name: Sideline content pipeline

# Manual runs only. The schedule moved to pg_cron in Supabase
# (supabase/migrations/20261013000000_pg_cron_pipeline.sql) after GitHub ran
# these 3 to 4 hours late and then skipped all of 2026-10-12.
on:
  workflow_dispatch:
    inputs:
      skip_ingest:
        description: 'Skip ingest-rss (only generate)'
        type: boolean
        default: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
      CS: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Ingest RSS
        if: ${{ inputs.skip_ingest != true }}
        run: |
          curl -fsS --retry 2 --retry-delay 10 \
            -X POST "$URL/ingest-rss" \
            -H "x-cron-secret: $CS"
          echo

      # Gemini free tier allows 20 requests/day per model. With 4 personas and
      # 3 daily windows the baseline is 12 requests; the function falls back
      # to other free models (GEMINI_FALLBACK_MODELS) on 503s and quota 429s.
      - name: Generate national briefings (per persona)
        run: |
          set -uo pipefail
          PERSONAS="cocktail_party office_watercooler date_night sports_talk_for_moms"
          FAILED=0
          for P in $PERSONAS; do
            echo "=== $P ==="
            OK=0
            for i in 1 2 3; do
              R=$(curl -fsS -X POST "$URL/generate-briefings" \
                -H "content-type: application/json" \
                -H "x-cron-secret: $CS" \
                -d "{\"personas\":[\"$P\"]}") || R='{"error":"curl failed"}'
              echo "$R"
              if echo "$R" | grep -q '"status":"succeeded"'; then OK=1; break; fi
              sleep 5
            done
            if [ "$OK" -ne 1 ]; then FAILED=1; fi
          done
          exit $FAILED
