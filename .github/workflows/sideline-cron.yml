name: Sideline content pipeline

# Manual runs only. The schedule moved to pg_cron in Supabase
# (supabase/migrations/20261013000000_pg_cron_pipeline.sql) after GitHub ran
# these 3 to 4 hours late and then skipped all of 2026-10-12.
on:
  workflow_dispatch:
    inputs:
      skip_ingest:
        description: 'Skip ingest-rss (only generate)'
        type: boolean
        default: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
      CS: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Ingest RSS
        if: ${{ inputs.skip_ingest != true }}
        run: |
          curl -fsS --retry 2 --retry-delay 10 \
            -X POST "$URL/ingest-rss" \
            -H "x-cron-secret: $CS"
          echo

      # Gemini can return regional 500/503 outages across every fallback model.
      # Six attempts with capped backoff give the vendor time to recover; each
      # function call has a shared 90-second model-chain budget.
      - name: Generate national briefings (per persona)
        run: |
          set -uo pipefail
          PERSONAS="cocktail_party office_watercooler date_night sports_talk_for_moms"
          FAILED=0
          for P in $PERSONAS; do
            echo "=== $P ==="
            OK=0
            for attempt in 1 2 3 4 5 6; do
              echo "Attempt $attempt"
              R=$(curl -fsS -X POST "$URL/generate-briefings" \
                -H "content-type: application/json" \
                -H "x-cron-secret: $CS" \
                -d "{\"personas\":[\"$P\"],\"missing_only\":true}") || R='{"error":"curl failed"}'
              echo "$R"
              if echo "$R" | grep -q '"status":"succeeded"'; then OK=1; break; fi
              if echo "$R" | grep -q '"skipped":"all_fresh"'; then OK=1; break; fi
              if echo "$R" | grep -Eqi 'Gemini request failed 429|RESOURCE_EXHAUSTED|quota exceeded'; then
                echo "Gemini quota exhausted for $P; not retrying immediately."
                break
              fi
              if (( attempt < 6 )); then
                BACKOFF=$((30 << (attempt - 1)))
                if (( BACKOFF > 300 )); then BACKOFF=300; fi
                echo "Transient failure for $P; retrying in ${BACKOFF}s."
                sleep "$BACKOFF"
              fi
            done
            if [ "$OK" -ne 1 ]; then FAILED=1; fi
          done
          exit $FAILED
