<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!-- Gist Play feature graphic. Palette from ui/theme/Theme.kt (card panel, gold on dark, paper). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15372A"/>
      <stop offset="1" stop-color="#1F5C45"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F5C45"/>
      <stop offset="1" stop-color="#15372A"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2A3A"/>
      <stop offset="1" stop-color="#1B4A3A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#06160F" flood-opacity="0.45"/>
    </filter>
    <clipPath id="bubbleClip">
      <circle cx="44" cy="44" r="44"/>
    </clipPath>
    <clipPath id="ballClip">
      <circle cx="120" cy="150" r="22"/>
    </clipPath>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="300" height="400" rx="26"/>
    </clipPath>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <circle cx="860" cy="250" r="300" fill="#FAF6EE" opacity="0.04"/>

  <!-- Speech bubble mark, after the app icon -->
  <g transform="translate(72 92)">
    <path d="M44 0 A44 44 0 1 1 18 80 L4 88 L10 72 A44 44 0 0 1 44 0 Z" fill="#FAF6EE"/>
    <path d="M-4 32 C24 24 38 38 48 54 C58 70 72 76 94 68" fill="none" stroke="#C5901A" stroke-width="7" clip-path="url(#bubbleClip)"/>
  </g>

  <text x="68" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" fill="#FAF6EE">Gist</text>
  <text x="72" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#EFC970">Sports small talk,</text>
  <text x="72" y="394" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#EFC970">ready in five minutes.</text>

  <!-- Card deck, after the in-app BriefingDeck -->
  <g transform="translate(640 64) rotate(6 150 200)" opacity="0.55">
    <rect width="300" height="400" rx="26" fill="#123326"/>
  </g>
  <g transform="translate(626 58) rotate(3 150 200)" opacity="0.8">
    <rect width="300" height="400" rx="26" fill="#173F30"/>
  </g>
  <g transform="translate(610 50)" filter="url(#shadow)">
    <g clip-path="url(#cardClip)">
      <rect width="300" height="400" fill="url(#card)"/>
      <rect width="300" height="200" fill="url(#art)"/>
      <!-- Abstract field: no teams, leagues or people -->
      <circle cx="232" cy="62" r="34" fill="#EFC970" opacity="0.9"/>
      <path d="M0 170 Q150 120 300 160 L300 200 L0 200 Z" fill="#2A6B51"/>
      <path d="M0 186 Q150 146 300 178" fill="none" stroke="#FAF6EE" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="120" cy="150" r="22" fill="#FAF6EE"/>
      <path d="M96 142 C110 134 122 152 144 146" fill="none" stroke="#C5901A" stroke-width="3.5" clip-path="url(#ballClip)"/>
    </g>
    <rect x="28" y="226" width="14" height="14" rx="3" fill="#EFC970"/>
    <text x="50" y="239" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="700" letter-spacing="2" fill="#EFC970">THE BRIEF</text>
    <text font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#FAF6EE">
      <tspan x="28" y="284">Field position can</tspan>
      <tspan x="28" y="318">quietly shape a</tspan>
      <tspan x="28" y="352">close game.</tspan>
    </text>
  </g>
</svg>
